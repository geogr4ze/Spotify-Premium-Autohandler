name: Payment tracker tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Block personal data and local configuration in public source
        run: npm run security:scan
      - name: Run mocked local tests (no Google credentials)
        run: npm test
